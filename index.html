<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イラストタイピング</title>

<style>
:root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --border:#dcdfe4;
    --text:#222;
    --sub:#777;
    --accent:#4a7cff;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    padding:8px;

    font-family:sans-serif;
    background:var(--bg);
    color:var(--text);

    overflow:hidden;
}

.container{
    max-width:800px;
    margin:0 auto;

    height:calc(100vh - 16px);

    display:flex;
    flex-direction:column;
    gap:8px;
}

h1{
    margin:0;

    text-align:center;
    font-size:clamp(20px,3vw,32px);

    flex:0 0 auto;
}

.card{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:12px;

    padding:10px;
}

.settings{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
}

.setting-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

label{
    font-size:14px;
    color:var(--sub);
}

select{
    padding:6px;
    font-size:16px;
}

.image-area{
    flex:1 1 auto;

    min-height:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#questionImage{
    flex:1;

    min-height:0;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    border:1px solid var(--border);
    border-radius:12px;

    background:white;
}

#kanaHint{
    margin-top:8px;

    font-size:clamp(24px,3vw,32px);

    color:#999;

    flex:0 0 auto;
}

#romanHint{
    margin-top:4px;

    font-size:clamp(18px,2.5vw,24px);

    color:#333;

    flex:0 0 auto;
}

.input-area{
    flex:0 0 auto;

    text-align:center;
}

#answerInput{
    width:100%;
    max-width:400px;

    padding:10px;

    font-size:clamp(20px,3vw,28px);

    text-align:center;
}

.actions{
    margin-top:10px;

    display:flex;
    justify-content:center;
    gap:10px;
}

button{
    padding:8px 16px;

    font-size:16px;

    cursor:pointer;
}

#message{
    margin-top:10px;

    min-height:28px;

    font-size:20px;
}

.score{
    flex:0 0 auto;

    text-align:center;

    font-size:18px;
}

.score span{
    font-weight:bold;
}

@media (max-width:600px){

    .container{
        gap:6px;
    }

    .card{
        padding:8px;
    }

    button{
        padding:8px 12px;
    }

}
@media (max-width:600px){

    body{
        padding:12px;
    }

    #kanaHint{
        font-size:26px;
    }

    #romanHint{
        font-size:20px;
    }

    #answerInput{
        font-size:24px;
    }

}
</style>
</head>

<body>

<div class="container">

    <h1>イラストタイピング</h1>

    <div class="card">
        <div class="settings">

            <div class="setting-group">
                <label for="supportLevel">
                    ヒント表示
                </label>
                <select id="supportLevel">
                    <option value="0">イラストのみ</option>
                    <option value="1">ひらがな表示</option>
                    <option value="2">ひらがな＋ローマ字表示</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="difficulty">
                    難易度
                </label>
                <select id="difficulty">
                    <option value="all">すべて</option>
                    <option value="1">かんたん</option>
                    <option value="2">ふつう</option>
                    <option value="3">むずかしい</option>
                </select>
            </div>

        </div>
    </div>

    <div class="card image-area">

        <img
            id="questionImage"
            src=""
            alt="問題画像">

        <div id="kanaHint"></div>

        <div id="romanHint"></div>

    </div>

    <div class="card input-area">

        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="ひらがなで入力">

        <div class="actions">

            <button id="checkButton">
                こたえる
            </button>

            <button id="nextButton">
                つぎへ
            </button>

        </div>

        <div id="message"></div>

    </div>

    <div class="card score">

        正解数：
        <span id="correctCount">0</span>

        ／

        出題数：
        <span id="totalCount">0</span>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
